# ─────────────────────────────────────────────────────────────────────────────
# Netlify deployment configuration — Bridge Design Suite
# ─────────────────────────────────────────────────────────────────────────────
# Architecture:
#   Frontend  → Netlify CDN  (dist/public)
#   Backend   → Netlify Functions  (netlify/functions/api.ts)
#
# Environment variables to set in Netlify dashboard → Site settings → Env vars:
#   DATABASE_URL      Neon PostgreSQL connection string
#   NODE_ENV          production
#   ALLOWED_ORIGINS   https://your-site.netlify.app  (comma-separated)
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command       = "npm run build:netlify"
  publish       = "dist/public"
  functions     = "netlify/functions"

[build.environment]
  NODE_VERSION  = "20"
  NODE_ENV      = "production"

# ── Functions ─────────────────────────────────────────────────────────────────
[functions]
  node_bundler  = "esbuild"
  # Increase timeout for Excel generation (default is 10 s on free tier)
  # Upgrade to Netlify Pro for 26 s; Background Functions for async work.

# ── Redirects / rewrites ──────────────────────────────────────────────────────
# 1. All /api/* calls → Netlify Function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# 2. SPA fallback — all /suite/* routes → index.html
[[redirects]]
  from   = "/suite/*"
  to     = "/index.html"
  status = 200

# 3. Root → index.html
[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
